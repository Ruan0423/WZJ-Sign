<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微助教自动签到助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 自定义滚动条样式 */
        .scroller::-webkit-scrollbar { width: 6px; }
        .scroller::-webkit-scrollbar-track { background: #f1f1f1; }
        .scroller::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .scroller::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        /* 背景动画 */
        .bg-gradient-animate {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center items-center text-sm sm:text-base font-sans bg-gradient-animate">

    <div id="app" class="w-full max-w-2xl px-4 py-8">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white drop-shadow-md mb-2">
                <i class="fa-solid fa-graduation-cap mr-2"></i>微助教助手
            </h1>
            <div class="flex justify-center gap-4 text-white/90">
                <a href="/dfyautosign" class="hover:text-white hover:underline underline-offset-4 transition"><i class="fa-solid fa-link mr-1"></i>分易签到</a>
                <span class="opacity-50">|</span>
                <a href="/xxtautosign" class="hover:text-white hover:underline underline-offset-4 transition"><i class="fa-solid fa-link mr-1"></i>学习通签到</a>
            </div>
        </div>

        <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-2xl overflow-hidden">
            
            <div class="p-6 sm:p-8 space-y-5">
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-1">OpenID <span class="text-red-500">*</span></label>
                    <input type="text" v-model="form.openid" placeholder="粘贴链接或OpenID" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition bg-gray-50">
                    <p class="text-xs text-gray-500 mt-1">有效期约3小时，请勿在复制后刷新微助教页面</p>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <div class="sm:col-span-2">
                        <label class="block text-gray-700 font-semibold mb-1">位置查询</label>
                        <div class="flex">
                            <input type="text" v-model="form.address" placeholder="输入教室/地点名称" 
                                @keyup.enter="getCoordinate"
                                class="w-full px-4 py-2 rounded-l-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none border-r-0">
                            <button @click="getCoordinate" :disabled="loading.geo"
                                class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-r-lg font-medium transition disabled:opacity-50 whitespace-nowrap">
                                <i class="fa-solid fa-location-dot" v-if="!loading.geo"></i>
                                <span v-else>...</span>
                            </button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-1">经纬度 (Lat,Lon)</label>
                        <input type="text" v-model="form.latlon" placeholder="30.59,114.37" 
                            class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50">
                    </div>
                </div>

                <div>
                    <label class="block text-gray-700 font-semibold mb-1">通知邮箱 (可选)</label>
                    <input type="email" v-model="form.email" placeholder="接收签到结果通知" 
                        class="w-full px-4 py-2 rounded-lg border border-gray-300 outline-none focus:border-green-500 transition">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                    <button @click="connectWebSocket" :disabled="loading.ws"
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transform active:scale-95 transition duration-200 flex items-center justify-center">
                        <i class="fa-solid fa-play mr-2" v-if="!loading.ws"></i>
                        <i class="fa-solid fa-circle-notch fa-spin mr-2" v-else></i>
                        开始实时签到
                    </button>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <button @click="handleMount('start')" :disabled="loading.mount"
                            class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow transition text-sm">
                            <i class="fa-solid fa-robot mr-1"></i> 后台挂载
                        </button>
                        <button @click="handleMount('stop')" :disabled="loading.mount"
                            class="bg-red-500 hover:bg-red-600 text-white font-semibold py-3 px-4 rounded-xl shadow transition text-sm">
                            <i class="fa-solid fa-stop mr-1"></i> 停止挂载
                        </button>
                    </div>
                </div>
            </div>

            <div class="bg-gray-900 text-gray-200 border-t border-gray-800">
                <div class="flex justify-between items-center px-4 py-2 bg-gray-800 text-xs text-gray-400">
                    <span><i class="fa-solid fa-terminal mr-2"></i>运行日志</span>
                    <span v-if="status.wsConnected" class="text-green-400"><i class="fa-solid fa-wifi mr-1"></i>已连接</span>
                    <span v-else class="text-red-400"><i class="fa-solid fa-ban mr-1"></i>未连接</span>
                </div>
                
                <div class="h-64 overflow-y-auto p-4 font-mono text-sm scroller" ref="logContainer">
                    <div v-if="logs.length === 0" class="text-gray-600 text-center mt-10">
                        暂无日志，请点击上方按钮开始
                    </div>
                    
                    <div v-for="(log, index) in logs" :key="index" class="mb-3 animate-fade-in">
                        <div v-if="log.type === 'text'" class="break-words">
                            <span class="text-green-500 mr-2">[${ log.time }]</span>
                            <span>${ log.content }</span>
                        </div>
                        
                        <div v-if="log.type === 'qrcode'" class="bg-gray-800 p-4 rounded-lg mt-2 flex flex-col items-center">
                            <p class="text-yellow-400 mb-2 font-bold">检测到二维码签到</p>
                            <img :src="`data:image/png;base64,${log.data}`" class="w-48 h-48 rounded-lg bg-white p-2 mb-3">
                            <a :href="log.qrUrl" target="_blank" class="text-blue-400 hover:text-blue-300 underline break-all text-center text-xs">
                                ${ log.qrUrl }
                            </a>
                            <p v-if="!isWeChat" class="text-xs text-gray-500 mt-2">非微信环境，请截图扫码或点击链接</p>
                        </div>

                        <div v-if="log.type === 'error'" class="text-red-400">
                            <span class="mr-2">[${ log.time }]</span>
                            <i class="fa-solid fa-circle-exclamation mr-1"></i> ${ log.content }
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-blue-50 p-4 text-xs text-blue-800 border-t border-blue-100">
                <div class="font-bold mb-1 flex items-center">
                    <i class="fa-solid fa-server mr-2"></i>后台监控列表 (${ mountList.length })
                </div>
                <div class="flex flex-wrap gap-2">
                    <span v-for="user in mountList" :key="user" class="bg-white px-2 py-1 rounded border border-blue-200 shadow-sm">
                        ${ user }
                    </span>
                    <span v-if="mountList.length === 0" class="opacity-60">当前无挂载用户</span>
                </div>
            </div>

            <div class="bg-gray-50 p-4 text-xs text-gray-500 text-center leading-relaxed">
                使用本工具产生的后果均自行承担，请勿过度依赖。<br>
                @WeChat-Trv0802
            </div>
        </div>

        <div class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 space-y-2 w-full max-w-xs pointer-events-none">
            <transition-group name="toast">
                <div v-for="toast in toasts" :key="toast.id" 
                    :class="{'bg-green-500': toast.type==='success', 'bg-red-500': toast.type==='error', 'bg-blue-500': toast.type==='info'}"
                    class="text-white px-4 py-3 rounded-lg shadow-lg text-center text-sm font-medium pointer-events-auto">
                    ${ toast.message }
                </div>
            </transition-group>
        </div>

    </div>

    <script>
        const { createApp, ref, reactive, onMounted, nextTick } = Vue;

        const app = createApp({
            setup() {
                // --- 状态管理 ---
                const form = reactive({
                    openid: '',
                    address: '',
                    latlon: '',
                    email: ''
                });

                const logs = ref([]);
                const toasts = ref([]);
                const mountList = ref([]);
                const loading = reactive({ geo: false, ws: false, mount: false });
                const status = reactive({ wsConnected: false });
                let ws = null;
                
                const isWeChat = /micromessenger/i.test(navigator.userAgent);
                const logContainer = ref(null);

                // --- 辅助函数 ---
                
                const addLog = (content, type = 'text', extra = {}) => {
                    const time = new Date().toLocaleTimeString();
                    logs.value.push({ time, content, type, ...extra });
                    if (logs.value.length > 50) logs.value.shift();
                    nextTick(() => {
                        if (logContainer.value) {
                            logContainer.value.scrollTop = logContainer.value.scrollHeight;
                        }
                    });
                };

                const showToast = (message, type = 'info') => {
                    const id = Date.now();
                    toasts.value.push({ id, message, type });
                    setTimeout(() => {
                        toasts.value = toasts.value.filter(t => t.id !== id);
                    }, 3000);
                };

                // --- 核心业务逻辑 ---

                const getCoordinate = async () => {
                    if (!form.address) return showToast('请输入地址名称', 'error');
                    
                    loading.geo = true;
                    try {
                        const res = await fetch(`/map/geocode?address=${encodeURIComponent(form.address)}`);
                        const data = await res.json();
                        
                        if (data.error) throw new Error(data.error);
                        
                        form.latlon = `${data.lat},${data.lon}`;
                        addLog(`已获取坐标：${data.address} (${form.latlon})`);
                        showToast('坐标获取成功', 'success');
                    } catch (e) {
                        showToast('获取失败：' + e.message, 'error');
                        addLog('坐标获取失败：' + e.message, 'error');
                    } finally {
                        loading.geo = false;
                    }
                };

                const connectWebSocket = async () => {
                    if (!form.openid) return showToast('请先输入 OpenID', 'error');
                    if (form.latlon && !/^-?\d+\.\d+,-?\d+\.\d+$/.test(form.latlon)) {
                        return showToast('经纬度格式错误 (例如: 30.59,114.37)', 'error');
                    }

                    loading.ws = true;
                    addLog('正在请求服务器建立连接...');

                    try {
                        const res = await fetch('/wzjsign', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(form)
                        });

                        if (!res.ok) throw new Error('服务器响应异常');
                        const data = await res.json();
                        
                        if (ws) ws.close();
                        ws = new WebSocket(data.wsUrl);

                        ws.onopen = () => {
                            status.wsConnected = true;
                            addLog('连接建立成功，正在验证 OpenID...', 'success');
                            loading.ws = false;
                        };

                        ws.onmessage = (event) => {
                            try {
                                const msg = JSON.parse(event.data);
                                if (msg.type === 'qrcode' && msg.data) {
                                    addLog('收到二维码', 'qrcode', { data: msg.data, qrUrl: msg.qrUrl });
                                    if (isWeChat) {
                                        window.location.href = msg.qrUrl; 
                                    }
                                } else {
                                    addLog(msg.text || event.data);
                                }
                            } catch (e) {
                                addLog(event.data); 
                            }
                        };

                        ws.onclose = () => {
                            status.wsConnected = false;
                            addLog('连接已断开', 'error');
                        };

                        ws.onerror = (err) => {
                            addLog('WebSocket 连接发生错误', 'error');
                            console.error(err);
                        };

                    } catch (e) {
                        loading.ws = false;
                        showToast('连接失败，请检查网络或 OpenID', 'error');
                        addLog('连接初始化失败: ' + e.message, 'error');
                    }
                };

                const handleMount = async (action) => {
                    if (!form.openid) return showToast('请输入 OpenID', 'error');
                    
                    loading.mount = true;
                    const url = action === 'start' ? '/wzjsign/mount/start' : '/wzjsign/mount/stop';
                    const payload = action === 'start' ? form : { openid: form.openid };

                    try {
                        const res = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        const data = await res.json();
                        
                        if (data.error) throw new Error(data.error);
                        
                        showToast(action === 'start' ? '后台挂载已启动' : '后台挂载已停止', 'success');
                        addLog(`系统消息: ${data.msg || (action === 'start' ? '挂载成功' : '停止成功')}`);
                        refreshMountList(); 
                    } catch (e) {
                        showToast('操作失败: ' + e.message, 'error');
                    } finally {
                        loading.mount = false;
                    }
                };

                const refreshMountList = async () => {
                    try {
                        const res = await fetch('/wzjsign/mount/list');
                        const data = await res.json();
                        if (data.mounts) {
                            mountList.value = data.mounts;
                        }
                    } catch (e) {
                        console.warn('获取挂载列表失败', e);
                    }
                };

                onMounted(() => {
                    refreshMountList();
                    setInterval(refreshMountList, 15000);
                });

                return {
                    form,
                    logs,
                    toasts,
                    mountList,
                    loading,
                    status,
                    isWeChat,
                    logContainer,
                    getCoordinate,
                    connectWebSocket,
                    handleMount
                };
            }
        });

        // --- 关键修改：更改 Vue 的界定符，防止与 Go 模板冲突 ---
        app.config.compilerOptions.delimiters = ['${', '}'];
        app.mount('#app');
    </script>

    <style>
        .toast-enter-active, .toast-leave-active { transition: all 0.3s ease; }
        .toast-enter-from, .toast-leave-to { opacity: 0; transform: translateY(-20px); }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</body>
</html>
